name: Video migration full test

on:
  # Manual only: this is a real end-to-end test (uploads to all hosts and
  # touches production), so it never runs automatically on push/merge.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: video-migration-full-test
  cancel-in-progress: false

env:
  SYNC_START_ROW: "0"
  SYNC_ROW_LIMIT: "4"
  ROW_LIMIT: "1"
  FORCE_REPROCESS: "true"
  SKIP_WATERMARK: "false"
  UPLOAD_STRATEGY: local_all_hosts
  SKIP_FANOUT_HOSTS: ""

jobs:
  seed:
    name: seed row ${{ matrix.start }}
    runs-on: windows-2025
    timeout-minutes: 330
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        start: [1, 2, 3]
    env:
      HOST_EARNVIDS_API_KEY: ${{ secrets.HOST_EARNVIDS_API_KEY }}
      HOST_DOOD_API_KEY: ${{ secrets.HOST_DOOD_API_KEY }}
      HOST_VOE_API_KEY: ${{ secrets.HOST_VOE_API_KEY }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout private migration data
        uses: actions/checkout@v4
        with:
          repository: ronganminh/stream-video-data
          token: ${{ secrets.MIGRATION_DATA_PAT }}
          path: migration-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check requests gdown

      - name: Ensure FFmpeg and ImageMagick
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          magick -version | Select-Object -First 1

      - name: Check scratch disk
        shell: pwsh
        run: |
          Get-PSDrive D -ErrorAction SilentlyContinue | Format-List
          New-Item -ItemType Directory -Force -Path D:\gv-work | Out-Null

      - name: Download, watermark, and upload one video to all hosts
        shell: pwsh
        run: >-
          python scripts/video-migration/seed_worker.py
          --csv migration-data/videos.csv
          --log migration-data/migration-log.csv
          --start "${{ matrix.start }}"
          --count "$env:ROW_LIMIT"
          --logo public/brand/logo-mark.svg
          --work-root D:\gv-work
          --output result-${{ matrix.start }}.csv
          --force "$env:FORCE_REPROCESS"
          --skip-watermark "$env:SKIP_WATERMARK"
          --upload-strategy "$env:UPLOAD_STRATEGY"
          --fail-on-error "true"

      - name: Upload shard result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: migration-full-test-result-${{ matrix.start }}
          path: result-${{ matrix.start }}.csv
          if-no-files-found: warn
          retention-days: 1

  merge_apply_and_sync:
    needs: seed
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HOST_DOOD_API_KEY: ${{ secrets.HOST_DOOD_API_KEY }}
      HOST_VOE_API_KEY: ${{ secrets.HOST_VOE_API_KEY }}
      HOST_EARNVIDS_API_KEY: ${{ secrets.HOST_EARNVIDS_API_KEY }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout private migration data
        uses: actions/checkout@v4
        with:
          repository: ronganminh/stream-video-data
          token: ${{ secrets.MIGRATION_DATA_PAT }}
          path: migration-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Prepare result directory
        run: mkdir -p migration-results

      - name: Download shard results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: migration-full-test-result-*
          path: migration-results
          merge-multiple: true

      - name: Merge log and prepare thumbnails
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: >-
          python scripts/video-migration/fanout_and_log.py
          --results migration-results
          --source migration-data/videos.csv
          --existing migration-data/migration-log.csv
          --output migration-data/migration-log.csv
          --thumbnail-output migration-thumbnail-payload.json
          --run-id "$GITHUB_RUN_ID_VALUE"
          --start "$SYNC_START_ROW"
          --limit "$SYNC_ROW_LIMIT"
          --skip-hosts "$SKIP_FANOUT_HOSTS"

      - name: Commit the migration log
        shell: bash
        working-directory: migration-data
        run: |
          git config user.name "gayvideo-migration[bot]"
          git config user.email "gayvideo-migration[bot]@users.noreply.github.com"
          git add migration-log.csv
          if git diff --cached --quiet; then
            echo "No migration log changes."
            exit 0
          fi
          git commit -m "Parallel full migration test log (run ${{ github.run_id }})"
          git push

      - name: Sync production and apply source thumbnails
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          PROD_MIGRATION_SSH_KEY: ${{ secrets.PROD_MIGRATION_SSH_KEY }}
        run: |
          if [ -z "${PROD_MIGRATION_SSH_KEY:-}" ]; then
            echo "PROD_MIGRATION_SSH_KEY not set; skipping production sync."
            echo "The server worker runs sync:new on its own schedule, so drafts are still created from the uploaded host files."
            exit 0
          fi

          : "${PROD_HOST:?PROD_HOST is required}"
          : "${PROD_USER:?PROD_USER is required}"
          : "${PROD_KNOWN_HOSTS:?PROD_KNOWN_HOSTS is required}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_MIGRATION_SSH_KEY" > "$HOME/.ssh/migration_key"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/migration_key" "$HOME/.ssh/known_hosts"

          # Production only accepts the restricted migration key, whose forced
          # command runs sync:new (with migration CSV metadata) and then applies
          # the source thumbnails. An empty payload is a sync-only request, so we
          # always pipe the payload even when there are no thumbnails.
          ssh \
            -i "$HOME/.ssh/migration_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            < migration-thumbnail-payload.json

          rm -f "$HOME/.ssh/migration_key"
