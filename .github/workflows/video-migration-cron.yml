name: Video migration cron

# Drip-feed migration: each run picks the next batch of not-yet-migrated
# videos and processes each in its own short job (download -> watermark ->
# upload to all 3 hosts), commits the merged log, then runs sync:new in
# production (with CSV tag metadata) and applies source thumbnails.
#
# Each job handles a single video so it never approaches the 6h job limit.
# Resume is automatic: select_pending.py skips rows already terminal in the
# migration log, so the backlog drains run by run with no manual start/limit.
# Re-run it (manually or on a schedule) until nothing pending remains.
#
# The 15-minute schedule is disabled by default (see the `on:` block); trigger
# runs manually with the "Run workflow" button until you choose to enable it.

on:
  workflow_dispatch:
    inputs:
      videos_per_tick:
        description: "Videos to process this run (one job each, max 256)"
        required: true
        default: "20"
  # Scheduled drip-feed is intentionally disabled. Run manually with the
  # "Run workflow" button, or re-enable the cron below when ready:
  # schedule:
  #   - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  # Only one tick runs at a time; a newer pending tick replaces the waiting one,
  # so ticks never pile up even if a run takes longer than 15 minutes.
  group: video-migration-cron
  cancel-in-progress: false

env:
  VIDEOS_PER_TICK: ${{ github.event.inputs.videos_per_tick || '20' }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      count: ${{ steps.select.outputs.count }}
      sync_start: ${{ steps.select.outputs.sync_start }}
      sync_limit: ${{ steps.select.outputs.sync_limit }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout private migration data
        uses: actions/checkout@v4
        with:
          repository: ronganminh/stream-video-data
          token: ${{ secrets.MIGRATION_DATA_PAT }}
          path: migration-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Select next pending videos
        id: select
        shell: bash
        run: |
          out="$(python scripts/video-migration/select_pending.py \
            --csv migration-data/videos.csv \
            --log migration-data/migration-log.csv \
            --count "$VIDEOS_PER_TICK")"
          echo "selection: $out"
          matrix="$(printf '%s' "$out" | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"include": d["include"]}, separators=(",", ":")))')"
          count="$(printf '%s' "$out" | python3 -c 'import json,sys; print(len(json.load(sys.stdin)["include"]))')"
          sync_start="$(printf '%s' "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sync_start"])')"
          sync_limit="$(printf '%s' "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin)["sync_limit"])')"
          {
            echo "matrix=$matrix"
            echo "count=$count"
            echo "sync_start=$sync_start"
            echo "sync_limit=$sync_limit"
          } >> "$GITHUB_OUTPUT"

  seed:
    needs: prepare
    if: ${{ needs.prepare.outputs.count != '0' }}
    runs-on: windows-2025
    timeout-minutes: 120
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      HOST_EARNVIDS_API_KEY: ${{ secrets.HOST_EARNVIDS_API_KEY }}
      HOST_DOOD_API_KEY: ${{ secrets.HOST_DOOD_API_KEY }}
      HOST_VOE_API_KEY: ${{ secrets.HOST_VOE_API_KEY }}
      GDRIVE_SERVICE_ACCOUNT_JSON: ${{ secrets.GDRIVE_SERVICE_ACCOUNT_JSON }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout private migration data
        uses: actions/checkout@v4
        with:
          repository: ronganminh/stream-video-data
          token: ${{ secrets.MIGRATION_DATA_PAT }}
          path: migration-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check requests gdown google-api-python-client google-auth

      - name: Ensure FFmpeg and ImageMagick
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          magick -version | Select-Object -First 1

      - name: Check scratch disk
        shell: pwsh
        run: |
          Get-PSDrive D -ErrorAction SilentlyContinue | Format-List
          New-Item -ItemType Directory -Force -Path D:\gv-work | Out-Null

      - name: Download, watermark, and upload one video to all hosts
        shell: pwsh
        run: >-
          python scripts/video-migration/seed_worker.py
          --csv migration-data/videos.csv
          --log migration-data/migration-log.csv
          --start "${{ matrix.start }}"
          --count "${{ matrix.count }}"
          --logo public/brand/logo-mark.svg
          --work-root D:\gv-work
          --output result-${{ matrix.shard }}.csv
          --force "false"
          --skip-watermark "false"
          --upload-strategy "local_all_hosts"
          --fail-on-error "true"

      - name: Upload shard result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: migration-cron-result-${{ matrix.shard }}
          path: result-${{ matrix.shard }}.csv
          if-no-files-found: warn
          retention-days: 1

  fanout_and_log:
    needs: [prepare, seed]
    if: ${{ always() && needs.prepare.outputs.count != '0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      HOST_DOOD_API_KEY: ${{ secrets.HOST_DOOD_API_KEY }}
      HOST_VOE_API_KEY: ${{ secrets.HOST_VOE_API_KEY }}
      HOST_EARNVIDS_API_KEY: ${{ secrets.HOST_EARNVIDS_API_KEY }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout private migration data
        uses: actions/checkout@v4
        with:
          repository: ronganminh/stream-video-data
          token: ${{ secrets.MIGRATION_DATA_PAT }}
          path: migration-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Prepare result directory
        run: mkdir -p migration-results

      - name: Download shard results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: migration-cron-result-*
          path: migration-results
          merge-multiple: true

      - name: Merge log and prepare thumbnails
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
          SYNC_START: ${{ needs.prepare.outputs.sync_start }}
          SYNC_LIMIT: ${{ needs.prepare.outputs.sync_limit }}
        run: >-
          python scripts/video-migration/fanout_and_log.py
          --results migration-results
          --source migration-data/videos.csv
          --existing migration-data/migration-log.csv
          --output migration-data/migration-log.csv
          --thumbnail-output migration-thumbnail-payload.json
          --run-id "$GITHUB_RUN_ID_VALUE"
          --start "$SYNC_START"
          --limit "$SYNC_LIMIT"
          --skip-hosts ""

      - name: Commit the migration log
        shell: bash
        working-directory: migration-data
        run: |
          git config user.name "gayvideo-migration[bot]"
          git config user.email "gayvideo-migration[bot]@users.noreply.github.com"
          git add migration-log.csv
          if git diff --cached --quiet; then
            echo "No migration log changes."
            exit 0
          fi
          git commit -m "Migration cron log (run ${{ github.run_id }})"
          git push

      - name: Sync production and apply source thumbnails
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          PROD_MIGRATION_SSH_KEY: ${{ secrets.PROD_MIGRATION_SSH_KEY }}
        run: |
          if [ -z "${PROD_MIGRATION_SSH_KEY:-}" ]; then
            echo "PROD_MIGRATION_SSH_KEY not set; skipping production sync."
            echo "The server worker runs sync:new on its own schedule, so drafts are still created from the uploaded host files."
            exit 0
          fi

          : "${PROD_HOST:?PROD_HOST is required}"
          : "${PROD_USER:?PROD_USER is required}"
          : "${PROD_KNOWN_HOSTS:?PROD_KNOWN_HOSTS is required}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_MIGRATION_SSH_KEY" > "$HOME/.ssh/migration_key"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/migration_key" "$HOME/.ssh/known_hosts"

          # Production only accepts the restricted migration key, whose forced
          # command runs sync:new (with migration CSV metadata so tags attach)
          # and then applies the source thumbnails. An empty payload is a
          # sync-only request, so sync:new always runs even without thumbnails.
          ssh \
            -i "$HOME/.ssh/migration_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            < migration-thumbnail-payload.json

          rm -f "$HOME/.ssh/migration_key"
