name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://gayvideo:gayvideo@localhost:5432/gayvideo?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Start PostgreSQL 16
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: docker compose up -d

      - name: Wait for PostgreSQL
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U gayvideo -d gayvideo; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs postgres
          exit 1

      - name: Run Prisma migration
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Stop PostgreSQL
        if: ${{ always() && hashFiles('docker-compose.yml') != '' }}
        run: docker compose down -v
