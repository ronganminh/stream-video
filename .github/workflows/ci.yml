name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      DATABASE_URL: postgresql://gayvideo:gayvideo@localhost:5432/gayvideo?schema=public
      ADMIN_SESSION_SECRET: e2e-admin-session-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Start PostgreSQL 16
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: docker compose up -d

      - name: Wait for PostgreSQL
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U gayvideo -d gayvideo; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs postgres
          exit 1

      - name: Run Prisma migration
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: npm run db:migrate

      - name: Seed deterministic E2E data
        if: ${{ hashFiles('docker-compose.yml') != '' }}
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npx playwright test

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop PostgreSQL
        if: ${{ always() && hashFiles('docker-compose.yml') != '' }}
        run: docker compose down -v
