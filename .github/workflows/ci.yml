name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SITE_DOMAIN: ci.example.test
      POSTGRES_DB: gayvideo
      POSTGRES_USER: gayvideo
      POSTGRES_PASSWORD: gayvideo
      POSTGRES_PORT: "5432"
      DATABASE_URL: postgresql://gayvideo:gayvideo@localhost:5432/gayvideo?schema=public
      ADMIN_SESSION_SECRET: e2e-admin-session-secret
      HOST_DOOD_API_KEY: ci-placeholder
      HOST_VOE_API_KEY: ci-placeholder
      HOST_EARNVIDS_API_KEY: ci-placeholder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate Compose
        run: docker compose config --quiet

      - name: Build production images
        run: docker compose build web worker

      - name: Validate Caddy syntax
        run: |
          docker run --rm \
            -e SITE_DOMAIN="$SITE_DOMAIN" \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine \
            caddy validate --config /etc/caddy/Caddyfile

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check generated Caddy CSP
        run: npm run caddy:check

      - name: Start PostgreSQL 16
        run: docker compose up -d postgres

      - name: Wait for PostgreSQL
        run: |
          for attempt in {1..30}; do
            if docker compose exec -T postgres pg_isready -U gayvideo -d gayvideo; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs postgres
          exit 1

      - name: Run Prisma migration
        run: npm run db:migrate

      - name: Seed deterministic E2E data
        run: npm run db:seed

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright E2E
        run: npx playwright test

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop PostgreSQL
        if: ${{ always() }}
        run: docker compose down -v
