name: Diag fetch (encrypted)

# Restores the health-removed videos on the VPS (approved by the owner) behind an X clip guard, and fetches the log. Runs only from
# the diag/removed-videos branch (on push). The file is never printed: it is
# encrypted on the runner with the age public key below (the private key never
# leaves the investigator's machine) and kept as an artifact for 1 day.
# A commit message containing [cleanup] deletes this workflow's artifacts instead.
on:
  push:
    branches: [diag/removed-videos]

permissions:
  contents: read
  actions: write

env:
  AGE_RECIPIENT: age10fr7uvzhkx478skte5kuj04quhlj2r64qlzxg200993nmlna3evsq6uege

jobs:
  fetch:
    if: ${{ !contains(github.event.head_commit.message, '[cleanup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch and encrypt
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          PROD_APP_DEPLOY_SSH_KEY: ${{ secrets.PROD_APP_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq age >/dev/null
          umask 077
          mkdir -p "$HOME/.ssh" "$RUNNER_TEMP/out"
          printf '%s\n' "$PROD_APP_DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          plain="$RUNNER_TEMP/plain.log"
          # The owner approved the restore: guard the X posts, then
          # videos:restore-health --apply; all output to ~/restore-apply.log
          # on the VPS, fetched here encrypted.
          ssh -i "$HOME/.ssh/deploy_key" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" "bash -s -- $(base64 -w0 scripts/diag/x-guard.ts)" > "$plain" <<'REMOTE'
          set -uo pipefail
          cd /opt/gayvideo
          SUDO=""
          docker info >/dev/null 2>&1 || SUDO="sudo -n"
          printf '%s' "$1" | base64 -d > /tmp/x-guard.ts
          xg() { $SUDO docker compose exec -T worker sh -c 'cat > /tmp/x-guard.ts && ./node_modules/.bin/tsx /tmp/x-guard.ts "$@"' x-guard "$@" < /tmp/x-guard.ts; }
          SLUGS="seachan-x-theresome-special-40-dancer-tung-duong-41 baker-longtongueboyvn-40-caubeluoidai-41-2 binkycum-straight-gym-x-fusu084"
          LOG="$HOME/restore-apply.log"
          {
            echo "### before"; xg report $SLUGS
            echo "### guard"; xg guard; guard=$?
            if [ "$guard" -ne 0 ]; then
              echo "### GUARD FAILED (exit $guard): restore NOT applied"
            else
              echo "### apply"
              $SUDO docker compose exec -T worker npm run -s videos:restore-health -- --apply < /dev/null
              echo "apply exit=$?"
            fi
            echo "### after"; xg report $SLUGS
          } > "$LOG" 2>&1
          cat "$LOG"
          rm -f /tmp/x-guard.ts
          REMOTE
          rm -f "$HOME/.ssh/deploy_key"
          echo "fetched $(wc -c < "$plain") bytes"
          age -r "$AGE_RECIPIENT" -o "$RUNNER_TEMP/out/restore-apply.log.age" "$plain"
          shred -u "$plain"

      - uses: actions/upload-artifact@v4
        with:
          name: restore-apply
          path: ${{ runner.temp }}/out/restore-apply.log.age
          retention-days: 1
          if-no-files-found: error

  cleanup:
    if: ${{ contains(github.event.head_commit.message, '[cleanup]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete diag artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          query='.artifacts[] | select(.name=="removed-diag" or .name=="restore-dryrun" or .name=="restore-apply") | .id'
          for id in $(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq "$query"); do
            gh api -X DELETE "repos/${{ github.repository }}/actions/artifacts/$id"
            echo "deleted artifact $id"
          done
          echo "remaining: $(gh api "repos/${{ github.repository }}/actions/artifacts?per_page=100" --jq "[$query] | length")"
