name: Video migration

on:
  workflow_dispatch:
    inputs:
      start:
        description: "0-based CSV row to start from"
        required: true
        default: "0"
      limit:
        description: "How many CSV rows to process in this run (recommended <= 900)"
        required: true
        default: "75"
      videos_per_job:
        description: "CSV rows per Windows runner"
        required: true
        default: "5"
      force:
        description: "Reprocess rows already in a terminal state"
        type: boolean
        required: true
        default: false
      skip_watermark:
        description: "Smoke test only: upload the source video without watermark/re-encode"
        type: boolean
        required: true
        default: false
      upload_strategy:
        description: "Upload mode: remote fanout via EarnVids direct link, or local upload to every host"
        type: choice
        required: true
        default: "remote_fanout"
        options:
          - remote_fanout
          - local_all_hosts
      skip_fanout_hosts:
        description: "Comma-separated fanout hosts to skip (dood, voe)"
        required: false
        default: ""
      apply_thumbnails:
        description: "Apply source-thumbnail payload in production"
        type: boolean
        required: true
        default: true
      sync_production:
        description: "Run sync:new in production after fanout"
        type: boolean
        required: true
        default: false
      sync_production_required:
        description: "Fail this workflow if the optional production sync command fails"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: video-migration
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout private migration data
        uses: actions/checkout@v4
        with:
          repository: ronganminh/stream-video-data
          token: ${{ secrets.MIGRATION_DATA_PAT }}
          path: migration-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build runner matrix
        id: matrix
        shell: bash
        run: |
          matrix="$(python scripts/video-migration/prepare.py --csv migration-data/videos.csv --start "${{ inputs.start }}" --limit "${{ inputs.limit }}" --per-job "${{ inputs.videos_per_job }}")"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "$matrix"

  seed:
    needs: prepare
    if: ${{ needs.prepare.outputs.matrix != '{"include":[]}' }}
    runs-on: windows-2025
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    env:
      HOST_EARNVIDS_API_KEY: ${{ secrets.HOST_EARNVIDS_API_KEY }}
      HOST_DOOD_API_KEY: ${{ secrets.HOST_DOOD_API_KEY }}
      HOST_VOE_API_KEY: ${{ secrets.HOST_VOE_API_KEY }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout private migration data
        uses: actions/checkout@v4
        with:
          repository: ronganminh/stream-video-data
          token: ${{ secrets.MIGRATION_DATA_PAT }}
          path: migration-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check requests gdown

      - name: Ensure FFmpeg and ImageMagick
        if: ${{ !inputs.skip_watermark }}
        shell: pwsh
        run: |
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            choco install ffmpeg -y --no-progress
          }
          if (-not (Get-Command magick -ErrorAction SilentlyContinue)) {
            choco install imagemagick -y --no-progress
          }
          ffmpeg -version | Select-Object -First 1
          magick -version | Select-Object -First 1

      - name: Check scratch disk
        shell: pwsh
        run: |
          Get-PSDrive D -ErrorAction SilentlyContinue | Format-List
          New-Item -ItemType Directory -Force -Path D:\gv-work | Out-Null

      - name: Download, optionally watermark, and seed
        shell: pwsh
        env:
          GV_FORCE: ${{ inputs.force }}
          GV_SKIP_WATERMARK: ${{ inputs.skip_watermark }}
          GV_UPLOAD_STRATEGY: ${{ inputs.upload_strategy }}
        run: >-
          python scripts/video-migration/seed_worker.py
          --csv migration-data/videos.csv
          --log migration-data/migration-log.csv
          --start "${{ matrix.start }}"
          --count "${{ matrix.count }}"
          --logo public/brand/logo-mark.svg
          --work-root D:\gv-work
          --output result.csv
          --force "$env:GV_FORCE"
          --skip-watermark "$env:GV_SKIP_WATERMARK"
          --upload-strategy "$env:GV_UPLOAD_STRATEGY"

      - name: Upload shard result
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: migration-result-${{ matrix.shard }}
          path: result.csv
          if-no-files-found: error
          retention-days: 1

  fanout_and_log:
    needs: [prepare, seed]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      HOST_DOOD_API_KEY: ${{ secrets.HOST_DOOD_API_KEY }}
      HOST_VOE_API_KEY: ${{ secrets.HOST_VOE_API_KEY }}
      HOST_EARNVIDS_API_KEY: ${{ secrets.HOST_EARNVIDS_API_KEY }}
    steps:
      - name: Checkout app
        uses: actions/checkout@v4

      - name: Checkout private migration data
        uses: actions/checkout@v4
        with:
          repository: ronganminh/stream-video-data
          token: ${{ secrets.MIGRATION_DATA_PAT }}
          path: migration-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Download temporary shard results
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: migration-result-*
          path: migration-results
          merge-multiple: true

      - name: Fan out to Dood and VOE, then merge one log
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: >-
          python scripts/video-migration/fanout_and_log.py
          --results migration-results
          --source migration-data/videos.csv
          --existing migration-data/migration-log.csv
          --output migration-data/migration-log.csv
          --thumbnail-output migration-thumbnail-payload.json
          --run-id "$GITHUB_RUN_ID_VALUE"
          --start "${{ inputs.start }}"
          --limit "${{ inputs.limit }}"
          --skip-hosts "${{ inputs.skip_fanout_hosts }}"

      - name: Commit the single migration log
        shell: bash
        working-directory: migration-data
        run: |
          git config user.name "gayvideo-migration[bot]"
          git config user.email "gayvideo-migration[bot]@users.noreply.github.com"
          git add migration-log.csv
          if git diff --cached --quiet; then
            echo "No migration log changes."
            exit 0
          fi
          git commit -m "Update migration log (run ${{ github.run_id }})"
          git push

      - name: Apply source thumbnails in production
        if: ${{ inputs.apply_thumbnails }}
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          PROD_MIGRATION_SSH_KEY: ${{ secrets.PROD_MIGRATION_SSH_KEY }}
        run: |
          count="$(python -c 'import json; print(len(json.load(open("migration-thumbnail-payload.json", encoding="utf-8"))))')"
          if [ "$count" -eq 0 ]; then
            echo "No source thumbnails to apply."
            exit 0
          fi

          : "${PROD_HOST:?PROD_HOST is required}"
          : "${PROD_USER:?PROD_USER is required}"
          : "${PROD_KNOWN_HOSTS:?PROD_KNOWN_HOSTS is required}"
          : "${PROD_MIGRATION_SSH_KEY:?PROD_MIGRATION_SSH_KEY is required}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_MIGRATION_SSH_KEY" > "$HOME/.ssh/migration_key"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/migration_key" "$HOME/.ssh/known_hosts"

          ssh \
            -i "$HOME/.ssh/migration_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            < migration-thumbnail-payload.json

          rm -f "$HOME/.ssh/migration_key"

      - name: Sync production mirrors
        if: ${{ inputs.sync_production }}
        continue-on-error: ${{ !inputs.sync_production_required }}
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          PROD_DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
        run: |
          : "${PROD_HOST:?PROD_HOST is required}"
          : "${PROD_USER:?PROD_USER is required}"
          : "${PROD_KNOWN_HOSTS:?PROD_KNOWN_HOSTS is required}"
          : "${PROD_DEPLOY_SSH_KEY:?PROD_DEPLOY_SSH_KEY is required}"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            "mkdir -p /opt/gayvideo/migration-data"

          scp \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            migration-data/videos.csv \
            migration-data/migration-log.csv \
            "$PROD_USER@$PROD_HOST:/opt/gayvideo/migration-data/"

          ssh \
            -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" \
            "cd /opt/gayvideo && MIGRATION_VIDEOS_CSV=/app/migration-data/videos.csv MIGRATION_LOG_CSV=/app/migration-data/migration-log.csv docker compose run --rm worker npm run sync:new"

          rm -f "$HOME/.ssh/deploy_key"
