name: Deploy production

# Manual deploy of main to the production VPS, following docs/DEPLOY.md §11.
# Needs an unrestricted shell key: the migration/secrets keys are forced-command.
on:
  workflow_dispatch:
    inputs:
      build_web:
        description: "Rebuild the web image (skip when only worker code changed)"
        type: boolean
        default: true
      run_backfill:
        description: "Run migration:backfill after deploy (tags/titles/source thumbnails)"
        type: boolean
        default: false
      resize_media:
        description: "Run media:resize after deploy (bring every stored thumbnail to 640x360)"
        type: boolean
        default: false
      report_slugs:
        description: "Print slugs that dropped đ (read-only report, changes nothing)"
        type: boolean
        default: false
      fix_slugs:
        description: "Rename video slugs that dropped đ (dry-run only prints; published videos keep a 301)"
        type: choice
        options: ["off", "dry-run-all", "apply-drafts", "apply-published", "apply-all"]
        default: "off"
      fix_titles:
        description: "Decode HTML entities in titles/tag names (dry-run only prints; reslug also fixes generated slugs, with a 301)"
        type: choice
        options: ["off", "dry-run", "dry-run-reslug", "apply", "apply-reslug"]
        default: "off"
  # Enable once manual deploys are proven:
  # push:
  #   branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Configure SSH
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          PROD_APP_DEPLOY_SSH_KEY: ${{ secrets.PROD_APP_DEPLOY_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in PROD_HOST PROD_USER PROD_KNOWN_HOSTS PROD_APP_DEPLOY_SSH_KEY; do
            if [ -z "${!name:-}" ]; then echo "::error::$name is not configured"; exit 1; fi
          done
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PROD_APP_DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"

      - name: Deploy on the VPS
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          BUILD_WEB: ${{ inputs.build_web }}
          RUN_BACKFILL: ${{ inputs.run_backfill }}
          RESIZE_MEDIA: ${{ inputs.resize_media }}
          REPORT_SLUGS: ${{ inputs.report_slugs }}
          FIX_SLUGS: ${{ inputs.fix_slugs }}
          FIX_TITLES: ${{ inputs.fix_titles }}
        run: |
          set -euo pipefail
          # The script is fed on stdin, so every remote command that could read
          # stdin is redirected from /dev/null; DEPLOY_COMPLETE proves the whole
          # script ran rather than bash stopping early at end of input.
          ssh -i "$HOME/.ssh/deploy_key" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o ServerAliveInterval=30 \
            "$PROD_USER@$PROD_HOST" \
            "bash -s -- '$BUILD_WEB' '$RUN_BACKFILL' '$RESIZE_MEDIA' '$REPORT_SLUGS' '$FIX_SLUGS' '$FIX_TITLES'" <<'REMOTE' | tee "$RUNNER_TEMP/deploy.log"
          set -euo pipefail
          # Parsed in full before it runs, with stdin detached from the script.
          main() {
          BUILD_WEB="$1"
          RUN_BACKFILL="$2"
          RESIZE_MEDIA="${3:-false}"
          REPORT_SLUGS="${4:-false}"
          FIX_SLUGS="${5:-off}"
          FIX_TITLES="${6:-off}"
          cd /opt/gayvideo

          # The deploy user may not be in the docker group (and a usermod only
          # takes effect on the next login), so fall back to passwordless sudo.
          SUDO=""
          if ! docker info >/dev/null 2>&1; then
            if sudo -n docker info >/dev/null 2>&1; then
              SUDO="sudo -n -E"
              echo "Using sudo for docker"
            else
              echo "::error::$(whoami) cannot run docker, with or without passwordless sudo"
              exit 1
            fi
          fi
          dc() { $SUDO docker compose "$@" </dev/null; }

          # The checkout may be owned by another user (e.g. root).
          GIT="git"
          if [ ! -w .git ]; then GIT="sudo -n git"; fi
          $GIT config --global --add safe.directory /opt/gayvideo || true
          $GIT config --global --add safe.directory /opt/gayvideo/migration-data || true

          PREVIOUS=$($GIT rev-parse HEAD)
          $GIT fetch origin
          $GIT checkout main
          $GIT pull --ff-only origin main
          echo "Deploying $($GIT rev-parse --short HEAD)"

          # Worker reads tags/thumbnails from this checkout (mounted read-only).
          if [ -d migration-data/.git ]; then
            $GIT -C migration-data status -sb </dev/null | head -3
            $GIT -C migration-data pull --ff-only origin main </dev/null \
              || echo "::warning::migration-data pull failed"
            echo "migration-data at $($GIT -C migration-data log -1 --format='%h %cd' </dev/null)"
          else
            echo "::warning::/opt/gayvideo/migration-data is not a git checkout"
          fi

          set -a
          if [ -r .env ]; then . ./.env; else . <(sudo -n cat .env); fi
          set +a
          dc config --quiet
          dc build worker
          dc up -d postgres
          until dc exec -T postgres pg_isready -U gayvideo -d gayvideo; do sleep 2; done
          dc run --rm worker ./node_modules/.bin/prisma migrate deploy

          if [ "$BUILD_WEB" = "true" ]; then
            # Newer Compose builds via bake, which refuses build.network: host
            # without an entitlement (same failure as CI). Fall back to the
            # classic builder.
            COMPOSE_BAKE=false dc build web
          fi

          dc up -d worker web caddy

          # Caddy mounts the Caddyfile read-only and reads it only at start, so
          # a changed Caddyfile needs a validated recreate to take effect.
          if ! $GIT diff --quiet "$PREVIOUS" HEAD -- Caddyfile; then
            echo "Caddyfile changed; validating and recreating caddy"
            $SUDO docker run --rm -e SITE_DOMAIN="$SITE_DOMAIN" \
              -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
              caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile </dev/null
            dc up -d --force-recreate caddy
          fi

          if [ "$RUN_BACKFILL" = "true" ]; then
            dc run --rm worker npm run migration:backfill || echo "::warning::backfill reported errors"
          fi

          # After backfill, so it only touches thumbnails backfill left alone.
          if [ "$RESIZE_MEDIA" = "true" ]; then
            dc run --rm worker npm run media:resize || echo "::warning::media:resize reported errors"
          fi

          if [ "$REPORT_SLUGS" = "true" ]; then
            dc run --rm worker npm run --silent slugs:lost-d </dev/null || echo "::warning::slugs:lost-d failed"
          fi

          case "$FIX_SLUGS" in
            off) ;;
            dry-run-all) FIX_ARGS="--scope=all" ;;
            apply-drafts) FIX_ARGS="--scope=drafts --apply" ;;
            apply-published) FIX_ARGS="--scope=published --apply" ;;
            apply-all) FIX_ARGS="--scope=all --apply" ;;
            *) echo "::error::unknown fix_slugs=$FIX_SLUGS"; exit 1 ;;
          esac
          if [ "$FIX_SLUGS" != "off" ]; then
            # shellcheck disable=SC2086
            dc run --rm worker npm run --silent slugs:fix-d -- $FIX_ARGS </dev/null || echo "::warning::slugs:fix-d reported skipped videos"
          fi

          case "$FIX_TITLES" in
            off) ;;
            dry-run) TITLE_ARGS="" ;;
            dry-run-reslug) TITLE_ARGS="--reslug" ;;
            apply) TITLE_ARGS="--apply" ;;
            apply-reslug) TITLE_ARGS="--reslug --apply" ;;
            *) echo "::error::unknown fix_titles=$FIX_TITLES"; exit 1 ;;
          esac
          if [ "$FIX_TITLES" != "off" ]; then
            # shellcheck disable=SC2086
            dc run --rm worker npm run --silent titles:decode -- $TITLE_ARGS </dev/null || echo "::warning::titles:decode reported skipped rows"
          fi

          dc ps
          for i in $(seq 1 30); do
            if curl -fsS "https://$SITE_DOMAIN/robots.txt" >/dev/null </dev/null; then
              echo "Site healthy"
              echo "DEPLOY_COMPLETE"
              exit 0
            fi
            sleep 5
          done
          echo "::error::https://$SITE_DOMAIN/robots.txt did not respond"
          exit 1
          }
          main "$@" </dev/null
          REMOTE
          grep -q '^DEPLOY_COMPLETE$' "$RUNNER_TEMP/deploy.log" \
            || { echo "::error::Remote deploy script did not run to completion"; exit 1; }

      - name: Remove SSH key
        if: ${{ always() }}
        run: rm -f "$HOME/.ssh/deploy_key"
