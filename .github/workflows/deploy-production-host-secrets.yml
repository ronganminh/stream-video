name: Deploy production host secrets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-host-secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PROD_HOST: ${{ vars.PROD_HOST }}
      PROD_USER: ${{ vars.PROD_USER }}

    steps:
      - name: Validate configuration
        env:
          HOST_DOOD_API_KEY: ${{ secrets.HOST_DOOD_API_KEY }}
          HOST_VOE_API_KEY: ${{ secrets.HOST_VOE_API_KEY }}
          HOST_EARNVIDS_API_KEY: ${{ secrets.HOST_EARNVIDS_API_KEY }}
          PROD_SSH_KEY: ${{ secrets.PROD_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail

          test -n "$PROD_HOST"
          test -n "$PROD_USER"
          test -n "$HOST_DOOD_API_KEY"
          test -n "$HOST_VOE_API_KEY"
          test -n "$HOST_EARNVIDS_API_KEY"
          test -n "$PROD_SSH_KEY"
          test -n "$PROD_KNOWN_HOSTS"

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$PROD_SSH_KEY" > "$HOME/.ssh/prod_key"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/prod_key" "$HOME/.ssh/known_hosts"

          python3 - <<'PY' | ssh             -i "$HOME/.ssh/prod_key"             -o BatchMode=yes             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=yes             "$PROD_USER@$PROD_HOST"
          import json
          import os
          import sys

          keys = (
              "HOST_DOOD_API_KEY",
              "HOST_VOE_API_KEY",
              "HOST_EARNVIDS_API_KEY",
          )
          json.dump({key: os.environ[key] for key in keys}, sys.stdout)
          PY
