name: Deploy production host secrets

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: deploy-production-host-secrets
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate required secrets
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          PROD_DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
          HOST_DOOD_API_KEY: ${{ secrets.HOST_DOOD_API_KEY }}
          HOST_VOE_API_KEY: ${{ secrets.HOST_VOE_API_KEY }}
          HOST_EARNVIDS_API_KEY: ${{ secrets.HOST_EARNVIDS_API_KEY }}
        run: |
          set -euo pipefail
          required=(
            PROD_HOST
            PROD_USER
            PROD_DEPLOY_SSH_KEY
            PROD_KNOWN_HOSTS
            HOST_DOOD_API_KEY
            HOST_VOE_API_KEY
            HOST_EARNVIDS_API_KEY
          )
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::$name is not configured"
              exit 1
            fi
          done

      - name: Configure SSH
        shell: bash
        env:
          PROD_DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          PROD_KNOWN_HOSTS: ${{ secrets.PROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PROD_DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$PROD_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/id_ed25519" "$HOME/.ssh/known_hosts"

      - name: Apply production host API secrets
        shell: bash
        env:
          PROD_HOST: ${{ secrets.PROD_HOST }}
          PROD_USER: ${{ secrets.PROD_USER }}
          HOST_DOOD_API_KEY: ${{ secrets.HOST_DOOD_API_KEY }}
          HOST_VOE_API_KEY: ${{ secrets.HOST_VOE_API_KEY }}
          HOST_EARNVIDS_API_KEY: ${{ secrets.HOST_EARNVIDS_API_KEY }}
        run: |
          set -euo pipefail
          payload="$(mktemp)"
          trap 'rm -f "$payload"' EXIT
          chmod 600 "$payload"

          python3 - "$payload" <<'PY'
          import json
          import os
          import sys

          keys = (
              "HOST_DOOD_API_KEY",
              "HOST_VOE_API_KEY",
              "HOST_EARNVIDS_API_KEY",
          )

          with open(sys.argv[1], "w", encoding="utf-8") as handle:
              json.dump({key: os.environ[key] for key in keys}, handle)
          PY

          ssh \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$PROD_USER@$PROD_HOST" < "$payload"
